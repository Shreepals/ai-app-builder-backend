      - name: Create Android project
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_IDEA: ${{ inputs.idea }}
        run: |
          set -euo pipefail
          APP_PACKAGE_ID="$(python3 -c 'import os,re; n=os.environ.get("APP_NAME","My App").lower(); n=re.sub(r"[^a-z0-9]+","",n); n=n or "myapp"; n=("app"+n) if n[0].isdigit() else n; print("com."+n)')"
          echo "APP_PACKAGE_ID=$APP_PACKAGE_ID" >> "$GITHUB_ENV"

          mkdir -p app/src/main/java/com/shreepals/aiapp

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AIAppBuilder"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          def appId = System.getenv("APP_PACKAGE_ID") ?: "com.myapp"

          android {
              namespace 'com.shreepals.aiapp'
              compileSdk 35

              defaultConfig {
                  applicationId appId
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

