

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      idea:
        description: "App idea"
        required: true
        type: string
      app_name:
        description: "App name"
        required: true
        default: "My App"
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
    
      - name: Generate full dashboard with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_IDEA: ${{ inputs.idea }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -euo pipefail

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "Missing GEMINI_API_KEY repository secret"
            exit 1
          fi

          mkdir -p app/src/main/assets

          cat > prompt.txt <<'PROMPT'
          You are a senior mobile app developer. Create one complete, polished, responsive HTML5 application for Android WebView.

          APP NAME: APP_NAME_PLACEHOLDER
          USER IDEA: APP_IDEA_PLACEHOLDER

          Build the app specifically for the user's idea. Do not make a generic calculator or landing page.

          Requirements:
          - Make a real multi-section mobile dashboard.
          - Use modern styling, cards, clear navigation, responsive layout, inline CSS and JavaScript.
          - Use Hindi labels when suitable for the user's idea.
          - Implement the requested features as far as possible.
          - Make navigation switch between visible sections.
          - Make buttons and forms functional.
          - Include loading, empty and error states where appropriate.
          - Do not invent live information or claim an API is connected when it is not.
          - For farming or weather apps, use Open-Meteo's public forecast API:
            https://api.open-meteo.com/v1/forecast
          - For weather apps, include current temperature, humidity, wind, feels-like temperature and a 5-day forecast, plus location controls and weather-based farming tips.
          - Handle denied location permission and network errors gracefully.
          - Do not use external JavaScript libraries.
          - Return ONLY a complete HTML document beginning with <!DOCTYPE html>.
          - Do not return Markdown fences or explanations.
          PROMPT

          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path("prompt.txt")
          text = p.read_text()
          text = text.replace("APP_NAME_PLACEHOLDER", os.environ.get("APP_NAME", "My App"))
          text = text.replace("APP_IDEA_PLACEHOLDER", os.environ.get("APP_IDEA", "Create a useful mobile app"))
          p.write_text(text)
          PY

          jq -n --rawfile prompt prompt.txt '{
            contents: [
              {
                parts: [
                  {
                    text: $prompt
                  }
                ]
              }
            ],
            generationConfig: {
              temperature: 0.3,
              maxOutputTokens: 8192
            }
          }' > request.json

          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 180 \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @request.json \
            -o response.json

          HTML="$(jq -r '[.candidates[0].content.parts[]?.text // empty] | join("\n")' response.json)"

          if [ -z "$HTML" ] || [ "$HTML" = "null" ]; then
            echo "Gemini did not return HTML."
            cat response.json
            exit 1
          fi

          printf '%s\n' "$HTML" | sed \
            -e '1{/^```html[[:space:]]*$/Id;}' \
            -e '/^```[[:space:]]*$/d' \
            > app/src/main/assets/index.html

          if ! grep -qi '<html' app/src/main/assets/index.html; then
            echo "Generated output is not a complete HTML document."
            exit 1
          fi

          if jq -e '.candidates[0].finishReason == "MAX_TOKENS"' response.json >/dev/null; then
            echo "Gemini output was truncated. Increase output limit or shorten the prompt."
            exit 1
          fi

          echo "App HTML generated successfully."  

      - name: Create Android project
        run: |
          set -e

          mkdir -p app/src/main/java/com/shreepals/aiapp

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AIAppBuilder"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.shreepals.aiapp'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.shreepals.aiapp'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="APP_NAME_PLACEHOLDER"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/shreepals/aiapp/MainActivity.java <<'EOF'
          package com.shreepals.aiapp;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.GeolocationPermissions;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setGeolocationEnabled(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(
                              String origin,
                              GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }
                  });

                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Download Gradle
        run: |
          set -e
          curl -L --fail \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build Android APK
        run: |
          set -e
          gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          set -e
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Myapp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
