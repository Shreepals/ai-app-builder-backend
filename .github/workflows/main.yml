

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      idea:
        description: "Describe the app you want to build"
        required: true
        type: string
      app_name:
        description: "App name"
        required: true
        default: "My AI App"
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          set -e
          sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate app using Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_IDEA: ${{ inputs.idea }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -e

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Missing GEMINI_API_KEY repository secret"
            exit 1
          fi

          mkdir -p app/src/main/assets

          jq -n \
            --arg idea "$APP_IDEA" \
            --arg name "$APP_NAME" \
            '{
              system_instruction: {
                parts: [{
                  text: "You are an expert mobile web app developer. Create a complete, functional, self-contained HTML app for Android WebView. Use inline HTML, CSS and JavaScript only. Make the app specifically match the user idea and app name. Make buttons work, provide a mobile-friendly interface, and use localStorage when suitable. Do not return explanations or Markdown fences. Return only the complete HTML document. Do not claim that unavailable APIs or online services work."
                }]
              },
              contents: [{
                parts: [{
                  text: ("App name: " + $name + "\nUser app idea: " + $idea + "\nBuild the actual app described above, not a calculator or generic template.")
                }]
              }],
              generationConfig: {
                temperature: 0.4,
                maxOutputTokens: 8192
              }
            }' > request.json

          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 180 \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @request.json \
            -o response.json

          HTML="$(jq -r '[.candidates[0].content.parts[]?.text // empty] | join("\n")' response.json)"

          if [ -z "$HTML" ] || [ "$HTML" = "null" ]; then
            echo "Gemini did not return HTML."
            cat response.json
            exit 1
          fi

          HTML="$(printf '%s' "$HTML" | sed '/^```html[[:space:]]*$/Id; /^```[[:space:]]*$/d')"

          printf '%s\n' "$HTML" > app/src/main/assets/index.html

          if ! grep -qi '<html' app/src/main/assets/index.html; then
            echo "Generated content is not a complete HTML document."
            exit 1
          fi

      - name: Create Android project
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -e

          mkdir -p app/src/main/java/com/shreepals/aiapp

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyApp"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.shreepals.aiapp'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.shreepals.aiapp'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="My AI App"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/shreepals/aiapp/MainActivity.java <<'EOF'
          package com.shreepals.aiapp;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView web = new WebView(this);
                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());

                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  WebView web = (WebView) findViewById(android.R.id.content).getRootView();
                  super.onBackPressed();
              }
          }
          EOF

          sed -i "s/android:label=\"My AI App\"/android:label=\"${APP_NAME//&/\\&amp;}\"/" app/src/main/AndroidManifest.xml

      - name: Download Gradle
        run: |
          set -e
          curl -L --fail \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: |
          set -e
          gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          set -e
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Myapp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
