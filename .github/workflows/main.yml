

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      idea:
        description: "Describe the app you want to build"
        required: true
        type: string
      app_name:
        description: "Name of your app"
        required: true
        default: "My App"
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate app HTML with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_IDEA: ${{ inputs.idea }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -euo pipefail

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "Missing GEMINI_API_KEY repository secret"
            exit 1
          fi

          mkdir -p app/src/main/assets

          python3 - <<'PY'
          import os
          import json
          from pathlib import Path

          name = os.environ.get("APP_NAME", "My App").strip() or "My App"
          idea = os.environ.get("APP_IDEA", "").strip()

          if not idea:
              raise SystemExit("App idea is empty.")

          prompt = f"""
          You are an expert Android mobile application developer and UI/UX designer.

          Create a COMPLETE, polished, usable mobile-first HTML5 application
          that will run inside an Android WebView.

          APP NAME:
          {name}

          USER'S EXACT APP IDEA:
          {idea}

          IMPORTANT:
          Build the application described by the user's idea, not a generic
          landing page, calculator, farmer app, or AI App Builder website.
          Never replace the requested idea with a different app.

          REQUIREMENTS:
          1. Return one complete HTML document with inline CSS and JavaScript.
          2. Create a visually polished, responsive mobile dashboard.
          3. Include a clear header, navigation, meaningful sections, cards,
             forms, and useful screens appropriate to THIS app idea.
          4. Implement the main requested features with working buttons,
             navigation, form validation, and useful feedback.
          5. Use localStorage where suitable for saving user-created data.
          6. Include loading, empty, and error states where appropriate.
          7. Use Hindi UI text when appropriate for the user's idea.
          8. Use accessible labels, readable text, and mobile-friendly controls.
          9. Do not invent real user accounts, payments, live prices, or
             successful server operations when those services are not connected.
          10. If a requested external service needs credentials or a backend,
              explain this limitation within the relevant screen and provide
              a usable demo where possible.
          11. Use only HTTPS for external requests. Do not use external
              JavaScript libraries or require a build step.
          12. Make the app work offline for features that do not need a network.
          13. Use the requested app name in the interface.
          14. Do not include a hardcoded unrelated brand such as Kisan Sahayata.
          15. Return ONLY the complete HTML, starting with <!DOCTYPE html>.
              Do not wrap the output in Markdown fences.

          Build the best complete implementation possible within a single
          HTML file. Prioritize functional features over decorative text.
          """

          Path("prompt.json").write_text(
              json.dumps({"prompt": prompt}, ensure_ascii=False)
          )
          PY

          jq -n --arg prompt "$(python3 -c 'import json; print(json.load(open("prompt.json"))["prompt"])')" '{
            contents: [
              {
                parts: [
                  {
                    text: $prompt
                  }
                ]
              }
            ],
            generationConfig: {
              temperature: 0.3,
              maxOutputTokens: 8192
            }
          }' > request.json

          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 240 \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @request.json \
            -o response.json

          if jq -e '.error' response.json >/dev/null; then
            echo "Gemini API returned an error:"
            jq -r '.error.message' response.json
            exit 1
          fi

          if jq -e '.candidates[0].finishReason == "MAX_TOKENS"' response.json >/dev/null; then
            echo "Gemini output was truncated. Shorten the requested app or increase the output limit."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          data = json.loads(Path("response.json").read_text())
          parts = data.get("candidates", [{}])[0].get("content", {}).get("parts", [])
          html = "\n".join(
              p.get("text", "") for p in parts if p.get("text")
          ).strip()

          html = re.sub(r"^```(?:html)?\s*", "", html, flags=re.I)
          html = re.sub(r"\s*```$", "", html)

          if not re.search(r"<!doctype\s+html|<html[\s>]", html, re.I):
              raise SystemExit("Gemini did not return a complete HTML document.")

          Path("app/src/main/assets/index.html").write_text(html)
          print("App HTML generated successfully.")
          print(f"Generated HTML size: {len(html)} characters")
          PY

      - name: Create Android project
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/shreepals/aiapp

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AIAppBuilder"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.shreepals.aiapp'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.shreepals.aiapp'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="APP_NAME_PLACEHOLDER"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          python3 - <<'PY'
          import os
          from pathlib import Path
          from xml.sax.saxutils import escape

          name = os.environ.get("APP_NAME", "My App").strip() or "My App"
          manifest = Path("app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          content = content.replace("APP_NAME_PLACEHOLDER", escape(name, {'"': '&quot;'}))
          manifest.write_text(content)
          PY

          cat > app/src/main/java/com/shreepals/aiapp/MainActivity.java <<'EOF'
          package com.shreepals.aiapp;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.GeolocationPermissions;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setGeolocationEnabled(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(
                              String origin,
                              GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }
                  });

                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Download Gradle
        run: |
          set -euo pipefail
          curl -L --fail \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build Android APK
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Myapp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
