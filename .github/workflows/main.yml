
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name"
        required: true
        type: string
        default: "My App"
      idea:
        description: "What should the app do?"
        required: true
        type: string
        default: "A useful mobile app with a clean dashboard"
      theme:
        description: "App theme"
        required: true
        type: choice
        options:
          - purple
          - blue
          - green
          - dark
        default: purple

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate app with Gemini AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_NAME: ${{ inputs.app_name }}
          APP_IDEA: ${{ inputs.idea }}
          APP_THEME: ${{ inputs.theme }}
        run: |
          set -e

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY secret is missing."
            exit 1
          fi

          mkdir -p app/src/main/assets

          jq -n \
            --arg prompt "Create a complete, attractive, mobile-first HTML app. App name: $APP_NAME. App idea and required features: $APP_IDEA. Theme: $APP_THEME. Include all CSS and JavaScript inside one standalone HTML file. Make buttons and main features work. Do not use external libraries or remote assets. Return ONLY complete HTML, without Markdown fences or explanations." \
            '{contents:[{parts:[{text:$prompt}]}],generationConfig:{temperature:0.2}}' \
            > request.json

          curl -fsS \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            --data @request.json \
            -o response.json

          jq -er \
            '[.candidates[0].content.parts[].text] | join("\n")' \
            response.json > app/src/main/assets/index.html

          sed -i '1{/^```html$/d;}' app/src/main/assets/index.html
          sed -i '${/^```$/d;}' app/src/main/assets/index.html

          if ! grep -Eiq '<html|<!doctype html' app/src/main/assets/index.html; then
            echo "Gemini did not return valid HTML."
            cat response.json
            exit 1
          fi

          echo "AI-generated app HTML created."

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/aibuilder/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AIApp"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.aibuilder.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.aibuilder.app'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="AI App"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/aibuilder/app/MainActivity.java <<'EOF'
          package com.aibuilder.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.setWebViewClient(new WebViewClient());
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-App-Builder-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
