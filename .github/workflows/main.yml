name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      idea:
        description: "App idea"
        required: true
        type: string
      app_name:
        description: "App name"
        required: false
        default: "My AI App"
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-l
