

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      idea:
        description: "App idea"
        required: true
        type: string
      app_name:
        description: "App name"
        required: true
        default: "Kisan Sahayata"
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate full dashboard with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_IDEA: ${{ inputs.idea }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -e

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Missing GEMINI_API_KEY repository secret"
            exit 1
          fi

          mkdir -p app/src/main/assets

          jq -n \
            --arg idea "$APP_IDEA" \
            --arg name "$APP_NAME" \
            '{
              system_instruction: {
                parts: [{
                  text: "You are a senior mobile UI developer. Generate one complete, polished, responsive HTML5 application for Android WebView. The app must be a REAL MULTI-SECTION DASHBOARD, never a simple landing page. Use Hindi labels where suitable, modern green agriculture styling for farming apps, cards, icons using inline SVG or CSS, spacing, rounded panels, useful navigation, working buttons and forms, and inline CSS and JavaScript. Implement every feature requested in the user idea. For a farming or weather app, create a full dashboard with: top app bar and location selector; weather card with current temperature, condition, humidity, wind and feels-like; a 5-day forecast; refresh and location controls; farming tips based on weather; quick-action cards; a detailed weather section; and a bottom navigation bar with Home, Weather, Farming Tips and Profile. Use browser geolocation where available and Open-Meteo's public forecast API (https://api.open-meteo.com/v1/forecast) for actual weather, with current, relative_humidity_2m, apparent_temperature, wind_speed_10m and daily weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max. Use suitable latitude and longitude for the selected location, allow a manual fallback location, handle denied location, loading and network errors, and clearly show when sample/fallback data is being used. Do not fabricate live weather data. Navigation must change visible sections; all key buttons must work. Persist suitable preferences in localStorage. Do not use external JavaScript libraries. Return ONLY the complete HTML document, beginning with <!DOCTYPE html>. Do not return Markdown fences, explanations or a generic calculator."
                }]
              },
              contents: [{
                parts: [{
                  text: ("APP NAME: " + $name + "\nUSER REQUEST: " + $idea + "\nBuild the complete requested application, with a detailed dashboard and working sections. Prioritize the user's requested features.")
                }]
              }],
              generationConfig: {
                temperature: 0.3,
                maxOutputTokens: 8192
              }
            }' > request.json

          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 180 \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @request.json \
            -o response.json

          HTML="$(jq -r '[.candidates[0].content.parts[]?.text // empty] | join("\n")' response.json)"

          if [ -z "$HTML" ] || [ "$HTML" = "null" ]; then
            echo "Gemini did not return HTML."
            cat response.json
            exit 1
          fi

          printf '%s\n' "$HTML" | sed \
            -e '1{/^```html[[:space:]]*$/Id;}' \
            -e '/^```[[:space:]]*$/d' \
            > app/src/main/assets/index.html

          if ! grep -qi '<html' app/src/main/assets/index.html; then
            echo "Generated output is not a complete HTML document."
            exit 1
          fi

          if grep -q 'finishReason' response.json && \
             jq -e '.candidates[0].finishReason == "MAX_TOKENS"' response.json >/dev/null; then
            echo "Gemini output was truncated. Increase output limit or shorten the prompt."
            exit 1
          fi

      - name: Create Android project
        run: |
          set -e

          mkdir -p app/src/main/java/com/shreepals/aiapp

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "KisanDashboard"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.shreepals.aiapp'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.shreepals.aiapp'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Kisan Sahayata"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/shreepals/aiapp/MainActivity.java <<'EOF'
          package com.shreepals.aiapp;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.GeolocationPermissions;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setGeolocationEnabled(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(
                              String origin,
                              GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }
                  });

                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Download Gradle
        run: |
          set -e
          curl -L --fail \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build Android APK
        run: |
          set -e
          gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          set -e
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Myapp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
