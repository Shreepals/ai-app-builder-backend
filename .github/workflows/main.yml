
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      idea:
        description: "Describe the app you want to build"
        required: true
        type: string
      app_name:
        description: "Name of your app"
        required: true
        default: "My App"
        type: string
      app_html_gzip_b64:
        description: "Generated app HTML compressed as base64"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          set -e
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate app HTML
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          APP_NAME: ${{ inputs.app_name }}
          APP_IDEA: ${{ inputs.idea }}
          APP_HTML_GZIP_B64: ${{ inputs.app_html_gzip_b64 }}
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets

          python3 - <<'PY'
          import os, re, json, base64, gzip
          from pathlib import Path

          name = os.environ.get("APP_NAME", "My App").strip() or "My App"
          idea = os.environ.get("APP_IDEA", "").strip()
          encoded = os.environ.get("APP_HTML_GZIP_B64", "").strip()
          key = os.environ.get("GEMINI_API_KEY", "")
          model = os.environ.get("GEMINI_MODEL", "gemini-3.1-flash-lite")

          if not idea:
              raise SystemExit("ERROR: App idea is empty")

          game_pattern = re.compile(
              r"\b(game|gaming|3d|2d|racing|race|runner|platformer|shooter|"
              r"shooting|adventure|puzzle|arcade|football|cricket|car game|"
              r"bike game|battle|survival|minecraft|gameplay)\b|"
              r"गेम|खेल|रेसिंग|दौड़|शूटिंग|एडवेंचर|पहेली|क्रिकेट गेम|कार गेम|बाइक गेम",
              re.I
          )
          is_game = bool(game_pattern.search(name + " " + idea))
          Path("is_game.txt").write_text(
              "yes" if is_game else "no", encoding="utf-8"
          )

          if encoded:
              try:
                  html = gzip.decompress(
                      base64.b64decode(encoded, validate=True)
                  ).decode("utf-8")
              except Exception as exc:
                  raise SystemExit("ERROR: Website HTML decode failed: " + str(exc))

              if not re.search(r"<!doctype\s+html", html, re.I):
                  raise SystemExit("ERROR: Website HTML has no doctype")
              if not re.search(r"</html\s*>", html, re.I):
                  raise SystemExit("ERROR: Website HTML is incomplete")
              if len(html) < 500:
                  raise SystemExit("ERROR: Website HTML is too short")

              Path("app/src/main/assets/index.html").write_text(
                  html, encoding="utf-8"
              )
              print("Using HTML supplied by the website.")

          else:
              if not key:
                  raise SystemExit("ERROR: GEMINI_API_KEY secret is missing")

              prompt = f"""
          Create a complete, functional, mobile-first Android web application.

          APP NAME: {name}
          EXACT USER IDEA: {idea}

          Build the actual application requested. Do not substitute a calculator,
          generic template, or unrelated dashboard.

          Requirements:
          - A polished dashboard designed specifically for this idea.
          - Multiple useful screens or sections when appropriate.
          - Working navigation and working primary buttons.
          - Relevant forms, cards, search, lists, and action flows.
          - Add, view, edit, and delete features where appropriate.
          - Save suitable user data using localStorage.
          - Mobile-first responsive design for Android phones.
          - A distinct inline SVG icon matching this app idea.
          - Clear success, error, and empty-state messages.
          - Label demo data honestly; do not pretend it is live.

          If this is a game, create the specific requested game with actual
          playable mechanics and mobile touch controls. Do not turn every game
          into racing. Use Canvas/CSS/JavaScript for 2D games. Use Three.js
          only if a real 3D game is appropriate. When using Three.js, include
          this exact URL:
          https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js
          Use the classic global THREE API, not ES modules.

          Return one complete standalone HTML document only.
          Start with <!DOCTYPE html> and end with </html>.
          Put CSS in style tags and JavaScript in script tags.
          No Markdown fences, no explanations, and no truncated examples.
          """

              request = {
                  "contents": [{"parts": [{"text": prompt}]}],
                  "generationConfig": {
                      "temperature": 0.2,
                      "maxOutputTokens": 16384
                  }
              }
              Path("request.json").write_text(
                  json.dumps(request), encoding="utf-8"
              )
              print("Prepared Gemini request for:", name)
          PY

          if [ -z "$APP_HTML_GZIP_B64" ]; then
            set +e
http_code=$(curl --silent --show-error \
  --max-time 300 \
  -w '%{http_code}' \
  -X POST \
  "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}" \
  -H "Content-Type: application/json" \
  -d @request.json \
  -o response.json)
curl_exit=$?
set -e

if [ "$curl_exit" -ne 0 ] || [ "$http_code" != "200" ]; then
  echo "Gemini HTTP status: ${http_code:-unknown}"
  echo "Gemini response:"
  cat response.json || true
  exit 1
fi

            python3 - <<'PY'
          import json, re
          from pathlib import Path

          data = json.loads(
              Path("response.json").read_text(encoding="utf-8")
          )

          if data.get("error"):
              raise SystemExit(
                  "Gemini API error: " +
                  data["error"].get("message", "Unknown error")
              )

          candidates = data.get("candidates", [])
          if not candidates:
              raise SystemExit("ERROR: Gemini returned no app HTML")

          candidate = candidates[0]
          if candidate.get("finishReason") == "MAX_TOKENS":
              raise SystemExit("ERROR: Gemini output was truncated")

          parts = candidate.get("content", {}).get("parts", [])
          html = "\n".join(
              part.get("text", "") for part in parts if part.get("text")
          ).strip()

          html = re.sub(r"^\s*```(?:html)?\s*", "", html, flags=re.I)
          html = re.sub(r"\s*```\s*$", "", html)

          checks = [
              (r"<!doctype\s+html", "Missing HTML doctype"),
              (r"<html[\s>]", "Missing HTML root"),
              (r"<body[\s>]", "Missing body"),
              (r"</html\s*>", "HTML is incomplete"),
              (r"<script[\s>]", "Missing JavaScript")
          ]

          for pattern, message in checks:
              if not re.search(pattern, html, re.I):
                  raise SystemExit("ERROR: " + message)

          if len(html) < 3000:
              raise SystemExit("ERROR: Generated HTML is too short")

          Path("app/src/main/assets/index.html").write_text(
              html, encoding="utf-8"
          )
          print("Generated app HTML saved. Length:", len(html))
          PY
          fi

          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("app/src/main/assets/index.html")
          html = path.read_text(encoding="utf-8")

          checks = [
              (r"<!doctype\s+html", "Missing HTML doctype"),
              (r"<html[\s>]", "Missing HTML root"),
              (r"<body[\s>]", "Missing body"),
              (r"</html\s*>", "HTML is incomplete")
          ]

          for pattern, message in checks:
              if not re.search(pattern, html, re.I):
                  raise SystemExit("ERROR: " + message)

          if len(html) < 500:
              raise SystemExit("ERROR: HTML is too short")

          print("HTML validation successful. Length:", len(html))
          PY

      
      - name: Add local Three.js for 3D games
        run: |
          set -euo pipefail

          if [ "$(cat is_game.txt)" = "yes" ]; then
            echo "Game detected. Downloading Three.js..."

            mkdir -p app/src/main/assets

            curl --fail --location --silent --show-error --retry 2 \
              "https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js" \
              -o app/src/main/assets/three.min.js

            test -s app/src/main/assets/three.min.js

            python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/src/main/assets/index.html")
          html = path.read_text(encoding="utf-8")

          cdn_pattern = (
              r'https?://cdn\.jsdelivr\.net/npm/three@0\.149\.0/'
              r'build/three\.min\.js'
          )

          html, count = re.subn(
              cdn_pattern,
              "three.min.js",
              html,
              flags=re.IGNORECASE
          )

          has_local_script = re.search(
              r'<script[^>]+src=["\'](?:\./)?three\.min\.js["\']',
              html,
              flags=re.IGNORECASE
          )

          uses_three = re.search(
              r'\bTHREE\s*\.|\bnew\s+THREE\b',
              html
          )

          if count == 0 and not has_local_script and uses_three:
              script = '<script src="three.min.js"></script>\n'
              if re.search(r'</head\s*>', html, re.IGNORECASE):
                  html = re.sub(
                      r'</head\s*>',
                      lambda m: script + m.group(0),
                      html,
                      count=1,
                      flags=re.IGNORECASE
                  )
              else:
                  html = script + html

          path.write_text(html, encoding="utf-8")
          print("Three.js local asset configured.")
          PY
          else
            echo "Regular app detected. Three.js is not needed."
          fi

      - name: Create Android project
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -euo pipefail

          APP_PACKAGE_ID="$(python3 -c 'import os,re; n=os.environ.get("APP_NAME","My App").lower(); n=re.sub(r"[^a-z0-9]+","",n); n=n or "myapp"; n=("app"+n) if n[0].isdigit() else n; print("com."+n)')"
          echo "APP_PACKAGE_ID=$APP_PACKAGE_ID" >> "$GITHUB_ENV"

          mkdir -p app/src/main/java/com/shreepals/aiapp

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AIAppBuilder"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          def appId = System.getenv("APP_PACKAGE_ID") ?: "com.myapp"
          android {
              namespace 'com.shreepals.aiapp'
              compileSdk 35
              defaultConfig {
                  applicationId appId
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="APP_NAME_PLACEHOLDER"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          python3 - <<'PY'
          import os
          from pathlib import Path
          from xml.sax.saxutils import escape

          path = Path("app/src/main/AndroidManifest.xml")
          name = os.environ.get("APP_NAME", "My App").strip() or "My App"
          text = path.read_text(encoding="utf-8")
          path.write_text(text.replace("APP_NAME_PLACEHOLDER", escape(name)), encoding="utf-8")
          PY

          cat > app/src/main/java/com/shreepals/aiapp/MainActivity.java <<'EOF'
          package com.shreepals.aiapp;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Generate launcher icon
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_IDEA: ${{ inputs.idea }}
        run: |
          set -euo pipefail
          python3 -m pip install --user Pillow
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          python3 - <<'PY'
          import os, hashlib
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          name = os.environ.get("APP_NAME", "My App").strip() or "My App"
          seed = hashlib.sha256((name + os.environ.get("APP_IDEA", "")).encode()).digest()
          colors = [(30,100,220),(120,65,190),(0,145,110),(220,90,45),(30,145,180),(190,65,100)]
          bg = colors[seed[0] % len(colors)]
          words = [w for w in name.split() if w]
          initials = "".join(w[0] for w in words[:2]).upper() or "A"
          sizes = {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}

          for folder, size in sizes.items():
              image = Image.new("RGBA", (size,size), (0,0,0,0))
              draw = ImageDraw.Draw(image)
              margin = int(size*0.06)
              draw.rounded_rectangle((margin,margin,size-margin,size-margin),radius=int(size*0.22),fill=bg)
              try:
                  font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",int(size*0.32))
              except Exception:
                  font = ImageFont.load_default()
              box = draw.textbbox((0,0),initials,font=font)
              x = (size-(box[2]-box[0]))/2
              y = (size-(box[3]-box[1]))/2-box[1]
              draw.text((x,y),initials,font=font,fill="white")
              image.save(Path("app/src/main/res")/folder/"ic_launcher.png")
          print("Launcher icon created.")
          PY

      - name: Install Gradle
        run: |
          set -euo pipefail
          curl -L --fail \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Compile Android APK
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          test -s app/src/main/assets/index.html
          test -s app/build/outputs/apk/debug/app-debug.apk
          if [ "$(cat is_game.txt)" = "yes" ]; then
            test -s app/src/main/assets/three.min.js
          fi
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Myapp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
