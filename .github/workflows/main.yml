          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Add local Three.js for 3D games
        run: |
          set -euo pipefail

          if [ "$(cat is_game.txt)" = "yes" ]; then
            echo "Game detected. Downloading Three.js..."

            curl --fail --location --silent --show-error --retry 2 \
              "https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js" \
              -o app/src/main/assets/three.min.js

            test -s app/src/main/assets/three.min.js

            python3 - <<'PY'
         from pathlib import Path
         import re

         path = Path("app/src/main/assets/index.html")
         html = path.read_text(encoding="utf-8")

         cdn_pattern = (
            r'https?://cdn\.jsdelivr\.net/npm/three@0\.149\.0/'
            r'build/three\.min\.js'
         )

         html, count = re.subn(
           cdn_pattern,
           "three.min.js",
           html,
          flags=re.I
        )

        if count == 0:
      print("No matching Three.js CDN URL found; checking HTML.")
     if re.search(r'three\.min\.js', html, re.I):
          print("A local Three.js reference already exists.")
     else:
        raise SystemExit(
            "ERROR: Game HTML does not reference Three.js. "
            "Regenerate the game HTML with the required Three.js script."
        )

     path.write_text(html, encoding="utf-8")
     print("Three.js local asset configuration completed.")
         PY
          else
            echo "Regular app detected. Three.js is not needed."
          fi
          
