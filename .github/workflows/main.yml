

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      idea:
        description: "Describe the app you want to build"
        required: true
        type: string
      app_name:
        description: "Name of your app"
        required: true
        default: "My App"
        type: string
      app_html_gzip_b64:
        description: "Generated app HTML compressed as base64"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          set -e
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Use HTML supplied by the website
        if: ${{ inputs.app_html_gzip_b64 != '' }}
        env:
          APP_HTML_GZIP_B64: ${{ inputs.app_html_gzip_b64 }}
          APP_IDEA: ${{ inputs.idea }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets

          python3 - <<'PY'
          import os, base64, gzip, re
          from pathlib import Path

          encoded = os.environ.get("APP_HTML_GZIP_B64", "").strip()
          if not encoded:
              raise SystemExit("ERROR: Supplied HTML is empty")

          try:
              compressed = base64.b64decode(encoded, validate=True)
              html = gzip.decompress(compressed).decode("utf-8")
          except Exception as exc:
              raise SystemExit("ERROR: Could not decode website HTML: " + str(exc))

          checks = [
              (r"<!doctype\s+html", "Missing HTML doctype"),
              (r"<html[\s>]", "Missing HTML root element"),
              (r"</html\s*>", "HTML is incomplete"),
              (r"<body[\s>]", "Missing body element"),
              (r"<script[\s>]", "Missing JavaScript"),
          ]

          for pattern, message in checks:
              if not re.search(pattern, html, re.I):
                  raise SystemExit("ERROR: " + message)

          if len(html) < 500:
              raise SystemExit("ERROR: Supplied HTML is too short")

          Path("app/src/main/assets/index.html").write_text(
              html, encoding="utf-8"
          )

          game_pattern = re.compile(
              r"\b(game|gaming|3d|2d|racing|race|runner|platformer|shooter|"
              r"shooting|adventure|puzzle|arcade|football|cricket|car game|"
              r"bike game|battle|survival|minecraft|gameplay)\b|"
              r"गेम|खेल|रेसिंग|दौड़|शूटिंग|एडवेंचर|पहेली|क्रिकेट गेम|कार गेम|बाइक गेम",
              re.I
          )

          name = os.environ.get("APP_NAME", "")
          idea = os.environ.get("APP_IDEA", "")
          is_game = bool(game_pattern.search(name + " " + idea))

          Path("is_game.txt").write_text(
              "yes" if is_game else "no", encoding="utf-8"
          )

          print("Website HTML received successfully.")
          print("HTML length:", len(html))
          print("Game detected:", is_game)
          PY

      - name: Generate app HTML with Gemini
        if: ${{ inputs.app_html_gzip_b64 == '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_IDEA: ${{ inputs.idea }}
          APP_NAME: ${{ inputs.app_name }}
          GEMINI_MODEL: gemini-3.1-flash-lite
        run: |
          set -euo pipefail

          test -n "$GEMINI_API_KEY" || {
            echo "ERROR: GEMINI_API_KEY secret is missing"
            exit 1
          }

          mkdir -p app/src/main/assets

          python3 - <<'PY'
          import os, json, re
          from pathlib import Path

          name = os.environ["APP_NAME"].strip() or "My App"
          idea = os.environ["APP_IDEA"].strip()

          if not idea:
              raise SystemExit("ERROR: App idea is empty")

          game_pattern = re.compile(
              r"\b(game|gaming|3d|2d|racing|race|runner|platformer|shooter|"
              r"shooting|adventure|puzzle|arcade|football|cricket|car game|"
              r"bike game|battle|survival|minecraft|gameplay)\b|"
              r"गेम|खेल|रेसिंग|दौड़|शूटिंग|एडवेंचर|पहेली|क्रिकेट गेम|कार गेम|बाइक गेम",
              re.I
          )

          is_game = bool(game_pattern.search(name + " " + idea))
          Path("is_game.txt").write_text(
              "yes" if is_game else "no", encoding="utf-8"
          )

          prompt = f"""
          Build a complete, usable mobile application.

          APP NAME: {name}
          USER IDEA: {idea}

          IMPORTANT:
          Build the exact application requested. Never replace it with
          a calculator, generic dashboard, or unrelated template.

          Create a polished, mobile-first app with:
          - A useful home/dashboard screen for this specific app.
          - Multiple relevant screens or sections.
          - Working navigation and back/home behavior.
          - Relevant forms, cards, lists, search, and action buttons.
          - Working core workflows, not decorative controls.
          - Form validation and useful success/error messages.
          - Add, view, edit, and delete functionality when appropriate.
          - localStorage persistence where useful, with safe error handling.
          - Responsive styling for Android phone screens.
          - Clear empty states and realistic demo data where helpful.
          - Hindi labels when suitable for the intended audience.

          Choose features based on the actual idea.
          Do not claim that mock data, payments, bookings, or live prices
          are real. Clearly indicate features that need a backend or API.
          """

          if is_game:
              prompt += """
          THIS REQUEST IS A GAME. Build the exact kind of game described
          in USER IDEA. Do not turn every game into car racing.
          Only make a car racing game if the user specifically asks for one.
          Cricket must be a cricket game, football a football game, a puzzle
          a puzzle game, and a platformer a platformer game.

          GAME DASHBOARD:
          - Create a polished game home screen with a title and working Play button.
          - Show instructions, score and best score where appropriate.
          - Keep the home screen and gameplay clearly separated.
          - Add working pause, resume, restart and home buttons when appropriate.
          - Make every main button perform its advertised action.

          GAMEPLAY:
          - Implement actual playable mechanics that match the requested game.
          - Add suitable controls for the chosen game, including mobile touch controls.
          - Track score, win/lose states and restart behavior where appropriate.
          - Use canvas or CSS/JavaScript for 2D games and simple games.
          - Use Three.js only when a real 3D game is suitable for the user's idea.
          - If using Three.js, use the classic global THREE API, not ES modules.
          - Include this exact script URL when using Three.js:
            https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js
          - The workflow replaces that URL with a local APK asset.
          - For a 3D game, create an interactive 3D scene and animation loop.
          - Do not use imports, modules, npm or additional external JS libraries.
          - Put all other CSS and JavaScript directly in this HTML file.
          - Make the game fit Android phone screens and work with touch.
          """
          else:
              prompt += """
          This is a regular application, not a game.
          Build a complete dashboard and working features that match the USER IDEA.
          Keep essential functionality available offline.
          Do not require external JavaScript libraries.
          """

          prompt += """
          TECHNICAL RULES:
          Return ONE complete standalone HTML document only.
          Start with <!DOCTYPE html> and end with </html>.
          Include CSS inside <style> and JavaScript inside <script>.
          Avoid eval and dynamically executing generated strings.
          Use accessible labels, semantic HTML and safe input handling.
          Implement real event handlers for the primary controls.
          No Markdown fences, no explanation, no truncated examples.
          Check that the HTML is complete, navigation works and core buttons work.
          """

          Path("request.json").write_text(json.dumps({
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {
                  "temperature": 0.2,
                  "maxOutputTokens": 16384
              }
          }), encoding="utf-8")
          PY

          curl --fail-with-body --silent --show-error \
            --retry 2 --max-time 300 \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @request.json \
            -o response.json

          python3 - <<'PY'
          import json, re
          from pathlib import Path

          data = json.loads(
              Path("response.json").read_text(encoding="utf-8")
          )

          if data.get("error"):
              raise SystemExit(
                  "Gemini API error: " +
                  data["error"].get("message", "Unknown error")
              )

          candidates = data.get("candidates", [])
          if not candidates:
              raise SystemExit("Gemini returned no app.")

          candidate = candidates[0]
          if candidate.get("finishReason") == "MAX_TOKENS":
              raise SystemExit(
                  "Generated app was truncated. No incomplete APK will be built."
              )

          parts = candidate.get("content", {}).get("parts", [])
          html = "\n".join(
              p.get("text", "") for p in parts if p.get("text")
          ).strip()

          html = re.sub(r"^\s*```(?:html)?\s*", "", html, flags=re.I)
          html = re.sub(r"\s*```\s*$", "", html)

          checks = [
              (r"<!doctype\s+html", "Missing HTML doctype"),
              (r"<html[\s>]", "Missing HTML root element"),
              (r"</html\s*>", "HTML is incomplete"),
              (r"<body[\s>]", "Missing body element"),
              (r"<style[\s>]", "Missing embedded CSS"),
              (r"<script[\s>]", "Missing embedded JavaScript"),
          ]

          for pattern, message in checks:
              if not re.search(pattern, html, re.I):
                  raise SystemExit("ERROR: " + message)

          if len(html) < 3000:
              raise SystemExit("ERROR: Generated HTML is too short")

          Path("app/src/main/assets/index.html").write_text(
              html, encoding="utf-8"
          )

          print("Generated HTML length:", len(html))
          print("App HTML saved successfully.")
          PY

             - name: Add local Three.js for 3D games
        run: |
          set -euo pipefail

          if [ "$(cat is_game.txt)" = "yes" ]; then
            echo "Game detected. Downloading Three.js..."

            curl --fail --location --silent --show-error --retry 2 \
              "https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js" \
              -o app/src/main/assets/three.min.js

            test -s app/src/main/assets/three.min.js

            python3 - <<'PY'
        
