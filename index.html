
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI App Builder</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5fb;color:#172033}
header{background:linear-gradient(135deg,#4533a8,#6e55e8);color:white;padding:24px 16px}
header h1{margin:0 0 8px}
main{max-width:850px;margin:18px auto;padding:0 12px 32px}
.card{background:white;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 5px 22px #17203312}
label{display:block;font-weight:bold;margin:12px 0 6px}
input,textarea,select{width:100%;padding:12px;border:1px solid #ccd2e2;border-radius:10px;font:inherit}
textarea{min-height:120px}
button{border:0;border-radius:10px;padding:12px 15px;font-weight:bold;font-size:15px;cursor:pointer}
button:disabled{opacity:.6}
.primary{background:#5541c8;color:white}
.secondary{background:#e9e6ff;color:#35248e}
.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
#status{padding:12px;border-radius:10px;background:#f1f3f9;margin-top:12px;line-height:1.6;overflow-wrap:anywhere}
#preview{padding:12px;overflow-wrap:anywhere}
a{color:#35248e;font-weight:bold}
</style>
</head>
<body>
<header>
<h1>🤖 AI App Builder</h1>
<p>अपना ऐप आइडिया लिखें, AI से प्लान बनाएँ और APK बिल्ड करें।</p>
</header>
<main>
<section class="card">
<h2>1. अपना ऐप बनाएँ</h2>
<label for="appName">ऐप का नाम</label>
<input id="appName" maxlength="60" placeholder="जैसे: किसान सहायता">

<label for="idea">ऐप का आइडिया</label>
<textarea id="idea" maxlength="5000" placeholder="आप किस तरह का ऐप चाहते हैं?"></textarea>

<label for="theme">डिज़ाइन</label>
<select id="theme">
<option value="purple">बैंगनी</option>
<option value="blue">नीला</option>
<option value="green">हरा</option>
<option value="dark">डार्क</option>
</select>

<div class="buttons">
<button class="primary" id="generateBtn">✨ AI से ऐप प्लान बनाएँ</button>
<button class="secondary" id="buildBtn">📦 APK बनाएँ</button>
</div>
<div id="status" role="status">तैयार है। ऐप का नाम और आइडिया लिखें।</div>
</section>

<section class="card">
<h2>2. AI का परिणाम</h2>
<div id="preview">AI प्लान यहाँ दिखाई देगा।</div>
</section>
</main>

<script>
const API = "https://ai-app-builder-backend-1.onrender.com";
const $ = id => document.getElementById(id);

function getForm(){
  return {
    appName:$("appName").value.trim() || "My AI App",
    idea:$("idea").value.trim(),
    theme:$("theme").value
  };
}

function showStatus(message){
  $("status").textContent = message;
}

async function requestJSON(url, options){
  const response = await fetch(url, options);
  const data = await response.json().catch(() => ({}));

  if(!response.ok){
    throw new Error(data.detail || data.error || "सर्वर से जवाब नहीं मिला।");
  }
  return data;
}

function renderPlan(result){
  const preview = $("preview");
  preview.replaceChildren();

  const heading = document.createElement("h3");
  heading.textContent = result.appName || getForm().appName;
  preview.appendChild(heading);

  const summary = document.createElement("p");
  summary.textContent = result.summary || "AI ने प्लान बनाया।";
  preview.appendChild(summary);

  const sections = [
    ["पेज", result.pages],
    ["मुख्य सुविधाएँ", result.features],
    ["डेटा मॉडल", result.dataModels],
    ["अगले कदम", result.nextSteps]
  ];

  for(const [title, items] of sections){
    if(!Array.isArray(items) || !items.length) continue;

    const h = document.createElement("h3");
    h.textContent = title;
    preview.appendChild(h);

    const ul = document.createElement("ul");
    for(const item of items){
      const li = document.createElement("li");
      li.textContent = typeof item === "object"
        ? `${item.name || ""} ${item.purpose || ""}`
        : String(item);
      ul.appendChild(li);
    }
    preview.appendChild(ul);
  }
}

async function generate(){
  const form = getForm();
  if(!form.idea){
    showStatus("पहले ऐप का आइडिया लिखें।");
    return;
  }

  $("generateBtn").disabled = true;
  showStatus("⏳ AI से प्लान माँगा जा रहा है...");

  try{
    const data = await requestJSON(`${API}/api/generate`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(form)
    });

    if(!data.result){
      throw new Error("AI प्लान नहीं मिला।");
    }

    renderPlan(data.result);
    showStatus("✅ AI प्लान बन गया।");
  }catch(error){
    showStatus("❌ AI प्लान नहीं बन पाया: " + error.message);
  }finally{
    $("generateBtn").disabled = false;
  }
}

async function buildAPK(){
  const form = getForm();

  if(!form.idea){
    showStatus("पहले ऐप का आइडिया लिखें।");
    return;
  }

  $("buildBtn").disabled = true;

  try{
    showStatus("⏳ GitHub पर APK बिल्ड शुरू हो रहा है...");

    await requestJSON(`${API}/api/build`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(form)
    });

    for(let i=0; i<120; i++){
      await new Promise(resolve => setTimeout(resolve, 5000));

      const status = await requestJSON(`${API}/api/build-status`);

      if(status.status === "completed"){
        if(status.conclusion === "success" && status.downloadUrl){
          showStatus("✅ APK तैयार है!");

          const link = document.createElement("a");
          link.href = status.downloadUrl;
          link.textContent = "⬇️ APK डाउनलोड करें (ZIP)";
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          $("status").appendChild(document.createElement("br"));
          $("status").appendChild(link);
          return;
        }

        throw new Error("APK बिल्ड असफल हुआ। GitHub Actions देखें।");
      }

      showStatus("⏳ APK बन रही है... " + ((i+1)*5) + " सेकंड");
    }

    showStatus("बिल्ड में समय लग रहा है। GitHub Actions में स्थिति देखें।");
  }catch(error){
    showStatus("❌ APK बिल्ड की समस्या: " + error.message);
  }finally{
    $("buildBtn").disabled = false;
  }
}

$("generateBtn").addEventListener("click", generate);
$("buildBtn").addEventListener("click", buildAPK);
</script>
</body>
</html>
